<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d241c"/>
      <stop offset="100%" stop-color="#242e22"/>
    </linearGradient>
    <linearGradient id="aboutAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3d996"/>
      <stop offset="100%" stop-color="#659A5A"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="256" height="256" rx="16" fill="url(#aboutBg)" stroke="#659A5A" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="10" y="10" width="240" height="240" rx="12" fill="none" stroke="#659A5A" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Molecular / Science Vector Icon -->
  <g transform="translate(130, 95)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="14" fill="#659A5A" fill-opacity="0.3" stroke="url(#aboutAccent)" stroke-width="2.5"/>
    <!-- Outer Nodes and Bonds -->
    <line x1="0" y1="0" x2="-35" y2="-25" stroke="#a3d996" stroke-width="2"/>
    <circle cx="-35" cy="-25" r="9" fill="#1d241c" stroke="#a3d996" stroke-width="2"/>

    <line x1="0" y1="0" x2="35" y2="-25" stroke="#a3d996" stroke-width="2"/>
    <circle cx="35" cy="-25" r="9" fill="#1d241c" stroke="#a3d996" stroke-width="2"/>

    <line x1="0" y1="0" x2="-25" y2="35" stroke="#a3d996" stroke-width="2"/>
    <circle cx="-25" cy="35" r="8" fill="#1d241c" stroke="#a3d996" stroke-width="2"/>

    <line x1="0" y1="0" x2="25" y2="35" stroke="#a3d996" stroke-width="2"/>
    <circle cx="25" cy="35" r="8" fill="#1d241c" stroke="#a3d996" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="160" width="180" height="22" rx="11" fill="#659A5A" fill-opacity="0.2" stroke="#659A5A" stroke-opacity="0.4"/>
    <text x="130" y="175" font-size="10" font-weight="700" fill="#a3d996" letter-spacing="1.2">GRÁFICA PLACEHOLDER</text>
    <text x="130" y="205" font-size="13" font-weight="600" fill="#ffffff">Ilustración Científica</text>
    <text x="130" y="225" font-size="11" fill="#a0a0a0">260 × 260 px</text>
  </g>
</svg>
