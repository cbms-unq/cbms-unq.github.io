<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="inBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e17"/>
      <stop offset="50%" stop-color="#222b20"/>
      <stop offset="100%" stop-color="#161c15"/>
    </linearGradient>
    <pattern id="inGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="inMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3d996"/>
      <stop offset="100%" stop-color="#659A5A"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="10" fill="url(#inBg)"/>
  <rect width="400" height="300" rx="10" fill="url(#inGrid)"/>
  <rect x="10" y="10" width="380" height="280" rx="8" fill="none" stroke="#659A5A" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Bio-Innovation Sprout & Molecule Icon -->
  <g transform="translate(200, 108)">
    <circle cx="0" cy="0" r="40" fill="#659A5A" fill-opacity="0.12" stroke="#659A5A" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="url(#inMint)" stroke-width="2.2"/>
    <line x1="-14" y1="-10" x2="-5" y2="-4" stroke="#a3d996" stroke-width="2"/>
    <circle cx="-16" cy="-12" r="4.5" fill="#181e17" stroke="#a3d996" stroke-width="2"/>
    <line x1="14" y1="-10" x2="5" y2="-4" stroke="#a3d996" stroke-width="2"/>
    <circle cx="16" cy="-12" r="4.5" fill="#181e17" stroke="#a3d996" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="16" stroke="#a3d996" stroke-width="2"/>
    <circle cx="0" cy="19" r="4.5" fill="#181e17" stroke="#659A5A" stroke-width="2"/>
  </g>

  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <rect x="115" y="168" width="170" height="24" rx="12" fill="#659A5A" fill-opacity="0.2" stroke="#659A5A" stroke-opacity="0.45"/>
    <text x="200" y="184" font-size="10" font-weight="700" fill="#a3d996" letter-spacing="1.6">FOTO PLACEHOLDER</text>
    <text x="200" y="216" font-size="15" font-weight="700" fill="#ffffff">Innovación</text>
    <text x="200" y="238" font-size="11.5" fill="#a0a0a0">Actividades de laboratorio · 4:3</text>
    <text x="200" y="264" font-size="10.5" fill="#74a367" font-style="italic">Pendiente de fotografía oficial</text>
  </g>
</svg>
